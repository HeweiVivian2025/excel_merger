<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Excel 多文件合并工具</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>📊 Excel 多文件合并工具</h1>
    <p>将多个结构相同的 Excel 文件内容合并到模板中。</p>

    <form id="uploadForm" enctype="multipart/form-data">
        <label>模板文件 (.xlsx)</label><br>
        <input type="file" name="template" accept=".xlsx" required><br><br>

        <label>数据源文件 (.xlsx, 可多选)</label><br>
        <input type="file" name="sources" accept=".xlsx" multiple required><br><br>

        <label>工作表名称 (多个用英文逗号分隔)</label><br>
        <input type="text" name="sheet_names" value="ROW MFG Monthly Fixed CA & KPI" required><br><br>

        <label>读取列 (列号，如: 5,6,7 表示 E,F,G)</label><br>
        <input type="text" name="read_cols" value="5,6,7" required><br><br>

        <label>写入起始列 (列号，如: 5 表示 E 列)</label><br>
        <input type="text" name="write_start_col" value="5" required><br><br>

        <label>数据起始行</label><br>
        <input type="number" name="data_start_row" value="6" required><br><br>

        <label>数据结束行</label><br>
        <input type="number" name="data_end_row" value="50" required><br><br>

        <button type="submit">上传并合并</button>
    </form>

    <div id="result"></div>

    <script>
        $('#uploadForm').on('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);

            $.ajax({
                url: '/upload',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    if (response.success) {
                        // ✅ 自动下载
                        const link = document.createElement('a');
                        link.href = response.download_url;
                        link.download = 'merged.xlsx';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);

                        $('#result').html(`
                            <p style="color: green;">${response.message}</p>
                            <p style="color: gray; font-size: 0.8em;">文件已自动下载</p>
                        `);
                    } else {
                        $('#result').html(`<p style="color: red;">${response.message}</p>`);
                    }
                },
                error: function() {
                    $('#result').html('<p style="color: red;">上传失败！</p>');
                }
            });
        });
    </script>
</body>
</html>
