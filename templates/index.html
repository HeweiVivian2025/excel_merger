<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Excel 合并工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            display: block;
            margin: 20px auto;
        }
        button:hover {
            background-color: #0056b3;
        }
        .status {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            color: #28a745;
        }
        .error {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Excel 合并工具</h1>
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="template">选择模板文件（.xlsx）</label>
                <input type="file" id="template" name="template" accept=".xlsx" required>
            </div>
            <div class="form-group">
                <label for="sources">选择源文件（可多选）</label>
                <input type="file" id="sources" name="sources" accept=".xlsx" multiple required>
            </div>
            <button type="submit">上传并合并</button>
        </form>
        <div id="status" class="status"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = '正在上传并合并...';
            statusDiv.className = 'status';

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    statusDiv.textContent = '✅ 文件已生成，正在下载...';
                    // 浏览器会自动处理下载（由 send_file 触发）
                } else {
                    return response.json().then(data => {
                        throw new Error(data.error || '未知错误');
                    });
                }
            })
            .catch(error => {
                console.error('上传失败:', error);
                statusDiv.textContent = '❌ 上传失败: ' + error.message;
                statusDiv.className = 'status error';
            });
        });
    </script>
</body>
</html>
